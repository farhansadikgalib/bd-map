<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="bd-map: interactive drill-down Bangladesh maps for React, Node and Flutter">
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#30363d"/>

  <!-- window dots -->
  <circle cx="34" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="30" r="6" fill="#febc2e"/>
  <circle cx="74" cy="30" r="6" fill="#28c840"/>

  <!-- title -->
  <text x="60" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="700" fill="#e6edf3" letter-spacing="-1">bd-map</text>
  <text x="60" y="146" font-family="-apple-system, 'Segoe UI', Inter, Roboto, sans-serif" font-size="20" fill="#8b949e">Interactive drill-down maps of Bangladesh · division → district → upazila → union</text>

  <!-- install commands -->
  <g transform="translate(60 172)">
    <rect width="620" height="72" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">$ <tspan fill="#79c0ff">npm</tspan> <tspan fill="#e6edf3">i @farhansadikgalib/bd-map</tspan></text>
    <text x="18" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8b949e">$ <tspan fill="#79c0ff">flutter</tspan> <tspan fill="#e6edf3">pub add bd_map</tspan></text>
  </g>

